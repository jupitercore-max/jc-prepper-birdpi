# jc-prepper-birdpi — pre-tuned BirdNET-Pi defaults
# Applied by install.sh to /etc/birdnet/birdnet.conf (key=value, one per line).
# Lines starting with # are comments and are skipped by the installer.

# --- Detection quality ---
# Confidence threshold: 0.7 filters most false positives while keeping good
# recall for birds near the mic. Raise to 0.8+ if you get too much junk;
# lower to 0.6 in dense habitat.
CONFIDENCE=0.7

# --- Recording ---
# 24/7 recording and analysis
PRIVACY_MODE=0
FULL_DISK=0

# --- Disk hygiene ---
# Clean the extraction cache daily so a 32GB SD doesn't fill up.
# BirdNET-Pi service handles actual cleanup; this sets the interval in days.
CLEANUP_INTERVAL=1

# --- Audio ---
# 48kHz / 3s clips is the BirdNET-Pi default; keep it.
# SAMPLE_RATE=48000

# --- Web UI ---
# LAN-only usage: plain HTTP (install.sh also strips the nginx HTTPS redirect).
# PIHTTPS=0
